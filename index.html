<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>Color Walk</title>
    <meta
      name="description"
      content="Pick a colour and walk through public-domain works that share it, from the Metropolitan Museum of Art, the Cleveland Museum of Art, the Rijksmuseum and the National Gallery of Art."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon-32.png" />

    <!-- Absolute, because scrapers ignore relative OG URLs. VITE_APP_URL is
         replaced at build time and asserted by scripts/assert-html-env.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Color Walk" />
    <meta property="og:title" content="Color Walk" />
    <meta
      property="og:description"
      content="Pick a colour and walk through public-domain paintings that share it."
    />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <meta property="og:image" content="%VITE_APP_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="preload"
      href="/fonts/fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
